# eropub – Plesk: Domain → Hosting & DNS → Apache & nginx-Einstellungen → „Zusätzliche nginx-Anweisungen“
# Voraussetzung: „Proxy-Modus“ (Weiterleitung an Apache) ist AUS.
# Leitet alle Anfragen an die eropub-Anwendung im Docker-Container (127.0.0.1:3000) weiter.

# Suchmaschinen sperren (zusätzlich zur Anwendung)
add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
add_header Strict-Transport-Security "max-age=31536000" always;

client_max_body_size 12m;

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Client-IP überschreiben (nicht anhängen) – für Ratelimits und Anbieter-IP-Prüfungen
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 300s;
    proxy_buffering off;
}
