# eropub – Plesk-Server OHNE nginx (nur Apache).
# Plesk: Domain → Hosting & DNS → Apache & nginx-Einstellungen →
#   „Zusätzliche Apache-Anweisungen“ für HTTP UND für HTTPS jeweils diesen Inhalt.
# Benötigte Apache-Module (Plesk: Tools & Einstellungen → Apache-Webserver):
#   proxy, proxy_http, proxy_wstunnel, headers
# Wirkt ausschließlich auf diese Domain. Vorher prüfen: apachectl -M | grep -E 'proxy_module|proxy_http|proxy_wstunnel|headers'

<IfModule mod_proxy.c>
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 300
    # Plesk-eigene Pfade (z. B. Let's-Encrypt-Prüfung) NICHT weiterleiten
    ProxyPass /.well-known/acme-challenge/ !
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
</IfModule>
<IfModule mod_headers.c>
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    Header always set X-Robots-Tag "noindex, nofollow, noarchive"
</IfModule>
