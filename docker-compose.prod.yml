# eropub.com – PRODUKTION.
#
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml run --rm migrate
#   docker compose -f docker-compose.prod.yml up -d
#
# Grundsätze:
# - Öffentlich erreichbar sind NUR Caddy (80/443) und LiveKit (RTC/TURN-Ports).
#   Postgres, Valkey und MinIO haben KEINE Host-Ports.
# - App-Konfiguration: .env.production (chmod 600). Infrastruktur-Passwörter: ./secrets/* (chmod 600).
# - Image-Tags sind gepinnt. Kein `latest`.
# - NIEMALS `docker compose down -v` gegen Produktion ausführen (löscht Datenbank und Medien).
name: eropub

x-app: &app
  env_file:
    - .env.production
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  # ───────────────────────────── Anwendung ─────────────────────────────
  web:
    <<: *app
    build:
      context: .
      target: web
    image: eropub-web:${EROPUB_TAG:-local}
    networks: [edge, backend]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M

  worker:
    <<: *app
    build:
      context: .
      target: worker
    image: eropub-worker:${EROPUB_TAG:-local}
    # egress: ausgehend SMTP, Zahlungs-/Identitätsanbieter, LiveKit-API
    networks: [backend, egress]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    # Kein HTTP-Port → kein Healthcheck. Überwachung über Outbox-Rückstau (docs/monitoring.md).
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  # Einmal-Job: Datenbankmigrationen. Läuft vor web/worker und beendet sich.
  migrate:
    <<: *app
    image: eropub-web:${EROPUB_TAG:-local}
    pull_policy: never   # nutzt das lokal gebaute web-Image
    restart: "no"
    command: ["npx", "--no-install", "prisma", "migrate", "deploy"]
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ──────────────────────────── Datenhaltung ────────────────────────────
  postgres:
    image: postgres:16.15-bookworm
    restart: unless-stopped
    networks: [backend]
    environment:
      POSTGRES_USER: eropub
      POSTGRES_DB: eropub
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - pg-data:/var/lib/postgresql/data
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eropub -d eropub"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  valkey:
    image: valkey/valkey:8.1.11
    restart: unless-stopped
    networks: [backend]
    secrets: [valkey_password]
    # Passwort aus Secret-Datei lesen; docker-entrypoint.sh wechselt danach auf den
    # unprivilegierten valkey-Benutzer. REDIS_URL in .env.production muss dasselbe Passwort enthalten.
    command:
      - sh
      - -c
      - >-
        exec docker-entrypoint.sh valkey-server
        --requirepass "$$(cat /run/secrets/valkey_password)"
        --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$$(cat /run/secrets/valkey_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M

  minio:
    # Upstream-MinIO veröffentlicht keine Docker-Hub-Images mehr; Community-Build (Pigsty).
    # Vor Produktivbetrieb Herkunft/Tag prüfen (docs/ubuntu-deployment.md, "Objektspeicher").
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    networks: [backend]
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      MINIO_BROWSER: "off"
    secrets: [minio_root_user, minio_root_password]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # Einmalig/manuell: Bucket + eingeschränkten App-Benutzer (S3_ACCESS_KEY/S3_SECRET_KEY) anlegen.
  #   docker compose -f docker-compose.prod.yml --profile tools run --rm minio-init
  minio-init:
    image: pgsty/mc:RELEASE.2026-10-26T00-00-00Z
    profiles: [tools]
    restart: "no"
    networks: [backend]
    env_file:
      - .env.production
    secrets: [minio_root_user, minio_root_password]
    entrypoint: ["/bin/sh", "/deploy/minio-init.sh"]
    volumes:
      - ./deploy/minio-init.sh:/deploy/minio-init.sh:ro
    depends_on:
      minio:
        condition: service_healthy

  # ─────────────────────────────── Edge ────────────────────────────────
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    networks: [edge]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      ACME_EMAIL: verwaltung@eropub.com
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    networks: [edge]
    command: ["--config", "/etc/livekit.yaml"]
    ports:
      - "7881:7881/tcp"              # ICE/TCP-Fallback
      - "50000-50100:50000-50100/udp" # ICE/UDP (WebRTC-Medien)
      - "3478:3478/udp"              # TURN/UDP (eingebettet)
      - "5349:5349/tcp"              # TURN/TLS (eingebettet, Zertifikat von Caddy)
    secrets: [livekit_keys]
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit.yaml:ro
      # TURN/TLS nutzt das von Caddy für rtc.eropub.com bezogene Zertifikat (nur lesend).
      - caddy-data:/caddy-data:ro
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

networks:
  # Caddy ↔ web ↔ livekit; ausgehender Internetzugang erlaubt
  edge:
  # Datenbank, Cache, Objektspeicher – KEIN Internetzugang, keine Host-Ports
  backend:
    internal: true
  # ausgehender Zugang für den Worker
  egress:

volumes:
  pg-data:
  valkey-data:
  minio-data:
  caddy-data:
  caddy-config:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  valkey_password:
    file: ./secrets/valkey_password
  minio_root_user:
    file: ./secrets/minio_root_user
  minio_root_password:
    file: ./secrets/minio_root_password
  # Format: eine Zeile "<LIVEKIT_API_KEY>: <LIVEKIT_API_SECRET>" – muss zu .env.production passen
  livekit_keys:
    file: ./secrets/livekit_keys
