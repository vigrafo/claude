name: CI
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: eropub
          POSTGRES_PASSWORD: eropub_dev
          POSTGRES_DB: eropub_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eropub" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://eropub:eropub_dev@localhost:5432/eropub_ci
      TEST_DATABASE_URL: postgresql://eropub:eropub_dev@localhost:5432/eropub_ci
      APP_ENV: test
      APP_URL: http://localhost:3000
      SESSION_SECRET: ci-secret-ci-secret-ci-secret-1234567
      DATA_ENCRYPTION_KEY: Y2ktb25seS1rZXktY2ktb25seS1rZXktMTIzNDU2Nzg=
      ENABLE_TEST_ADAPTERS: "true"
      ALLOW_SEARCH_INDEXING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx next build
